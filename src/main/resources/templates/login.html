<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Entrar')}"></head>
<body>
<th:block th:replace="~{fragmentos :: botaoTema('tema-flutuante')}"></th:block>
<main class="entrada">
	<section class="cartao painel" aria-labelledby="titulo-login">
		<div class="marca">
			<span class="marca-icone"><th:block th:replace="~{fragmentos :: icone('carteira')}"></th:block></span>
			<span><strong>Finora</strong><small>Suas finanças em equilíbrio</small></span>
		</div>
		<div>
			<h1 id="titulo-login">Entrar</h1>
			<p class="suave">Acesse com seu e-mail ou nome de usuário e sua senha.</p>
		</div>

		<div class="aviso falha" role="alert" th:if="${param.erro}">
			<th:block th:replace="~{fragmentos :: icone('alerta')}"></th:block>E-mail ou senha inválidos.
		</div>
		<div class="aviso sucesso" role="status" th:if="${param.saiu}">Você saiu do sistema.</div>
		<div class="aviso sucesso" role="status" th:if="${sucesso}" th:text="${sucesso}">Conta criada.</div>
		<div class="aviso falha" role="alert" th:if="${falha}" th:text="${falha}">Indisponível.</div>

		<form id="form-login" th:action="@{/login}" method="post" novalidate>
			<label>E-mail ou nome de usuário
				<input id="email" name="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
					placeholder="voce@exemplo.com ou seu.usuario" data-obrigatorio="Informe seu e-mail ou nome de usuário." autofocus>
				<span class="erro" id="email-erro"></span>
			</label>
			<label>Senha
				<input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha"
					data-obrigatorio="Informe sua senha.">
				<span class="erro" id="senha-erro"></span>
			</label>
			<button class="btn btn-p" type="submit"><span>Entrar</span><th:block th:replace="~{fragmentos :: icone('seta')}"></th:block></button>
		</form>

		<p class="suave" th:if="${recuperacao}"><a th:href="@{/senha/esqueci}">Esqueci minha senha</a></p>
		<p class="suave">Ainda não tem conta? <a th:href="@{/cadastro}">Criar conta</a></p>
	</section>
</main>
</body>
</html>
