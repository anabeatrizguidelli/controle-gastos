<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nova despesa</title>
	<link rel="stylesheet" th:href="@{/estilo.css}">
</head>
<body>
<main>
	<h1>Nova despesa</h1>
	<form th:action="@{/despesas}" th:object="${despesa}" method="post">
		<label>Descrição
			<input type="text" th:field="*{descricao}" placeholder="Ex.: Almoço no RU">
			<span class="erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>
		</label>
		<label>Valor (R$)
			<input type="number" step="0.01" min="0.01" th:field="*{valor}">
			<span class="erro" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></span>
		</label>
		<label>Data
			<input type="date" th:field="*{data}">
			<span class="erro" th:if="${#fields.hasErrors('data')}" th:errors="*{data}"></span>
		</label>
		<label>Categoria
			<select th:field="*{categoria}">
				<option value="">Selecione...</option>
				<option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}">Alimentação</option>
			</select>
			<span class="erro" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
		</label>
		<button type="submit">Salvar</button>
		<a th:href="@{/despesas}">Voltar para a lista</a>
	</form>
</main>
</body>
</html>
