spring.application.name=controle-gastos

# Banco H2 salvo em arquivo (os dados continuam ao reiniciar a aplicação)
spring.datasource.url=jdbc:h2:file:./data/controle-gastos
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
